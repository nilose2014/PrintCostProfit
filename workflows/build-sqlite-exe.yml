name: Compilar adaptador SQLite para Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "pcp_sqlite_api.py"
      - "pcp_sqlite_store.py"
      - ".github/workflows/build-sqlite-exe.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python de compilación
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Compilar ejecutable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name pcp_sqlite_api pcp_sqlite_api.py
          if (!(Test-Path "dist/pcp_sqlite_api.exe")) {
            throw "No se generó dist/pcp_sqlite_api.exe"
          }

      - name: Publicar ejecutable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pcp-sqlite-api-windows
          path: dist/pcp_sqlite_api.exe
          if-no-files-found: error
          retention-days: 30
