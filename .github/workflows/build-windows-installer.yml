name: Crear instalador Windows Print Cost & Profit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Configurar Python de compilacion
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de compilacion
        run: python -m pip install --upgrade pip pyinstaller pillow
      - name: Compilar servicio SQLite
        run: python -m PyInstaller --clean --onefile --name pcp_sqlite_api pcp_sqlite_api.py
      - name: Crear icono de Windows
        run: python installer/create_icon.py
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Leer version de la aplicacion
        id: app_version
        shell: pwsh
        run: echo "version=$((Get-Content VERSION -Raw).Trim())" >> $env:GITHUB_OUTPUT
      - name: Compilar instalador
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "No se encuentra Inno Setup: $compiler" }
          if (!(Test-Path "dist\pcp_sqlite_api.exe")) { throw "No se ha generado pcp_sqlite_api.exe" }
          & $compiler "installer\PrintCostProfit.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC ha terminado con codigo $LASTEXITCODE" }
      - name: Publicar artefacto de compilacion manual
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PrintCostProfit-Windows-Installer-v${{ steps.app_version.outputs.version }}
          path: dist-installer/PrintCostProfit-Setup-*.exe
          if-no-files-found: error
      - name: Crear Release y adjuntar instalador en ejecucion manual o etiqueta
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          target_commitish: main
          name: Print Cost & Profit v${{ steps.app_version.outputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: dist-installer/PrintCostProfit-Setup-*.exe
