name: Crear instalador Windows Print Cost & Profit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python de compilacion
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de compilacion
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Compilar servicio SQLite
        run: python -m PyInstaller --clean --onefile --name pcp_sqlite_api pcp_sqlite_api.py

      - name: Crear icono de Windows
        run: python installer/create_icon.py

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Leer version de la aplicacion
        id: app_version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+(\.\d+)?$') {
            throw "Formato de VERSION no valido: $version"
          }
          $parts = @($version.Split('.'))
          while ($parts.Count -lt 4) { $parts += '0' }
          $versionInfo = ($parts | Select-Object -First 4) -join '.'
          "version=$version" >> $env:GITHUB_OUTPUT
          "version_info=$versionInfo" >> $env:GITHUB_OUTPUT

      - name: Compilar instalador
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $compiler = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "No se encuentra Inno Setup: $compiler" }
          if (!(Test-Path "dist\pcp_sqlite_api.exe")) { throw "No se ha generado pcp_sqlite_api.exe" }
          & $compiler "/DMyAppVersion=${{ steps.app_version.outputs.version }}" "/DMyAppVersionInfo=${{ steps.app_version.outputs.version_info }}" "installer\PrintCostProfit.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC ha terminado con codigo $LASTEXITCODE" }
          $installer = "dist-installer\PrintCostProfit-Setup-${{ steps.app_version.outputs.version }}.exe"
          if (!(Test-Path $installer)) { throw "No se ha generado el instalador esperado: $installer" }

      - name: Empaquetar instalador en ZIP para descarga
        shell: pwsh
        run: |
          $installer = "dist-installer\PrintCostProfit-Setup-${{ steps.app_version.outputs.version }}.exe"
          if (!(Test-Path $installer)) { throw "No se encuentra el instalador para empaquetar." }
          $zipPath = "dist-installer\PrintCostProfit-Windows-Installer-v${{ steps.app_version.outputs.version }}.zip"
          Compress-Archive -Path $installer -DestinationPath $zipPath -Force
          if (!(Test-Path $zipPath)) { throw "No se ha creado el ZIP del instalador." }

      - name: Publicar artefacto descargable (sin crear Release)
        uses: actions/upload-artifact@v4
        with:
          name: PrintCostProfit-Windows-Installer-v${{ steps.app_version.outputs.version }}
          path: dist-installer/PrintCostProfit-Windows-Installer-v*.zip
          if-no-files-found: error
          retention-days: 30
