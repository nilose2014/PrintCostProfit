name: Crear instalador Windows Print Cost & Profit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Configurar Python de compilacion
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de compilacion
        run: python -m pip install --upgrade pip pyinstaller pillow
      - name: Compilar servicio SQLite
        run: python -m PyInstaller --clean --onefile --name pcp_sqlite_api pcp_sqlite_api.py
      - name: Crear icono de Windows
        run: python installer/create_icon.py
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Leer version de la aplicacion
        id: app_version
        shell: pwsh
        run: echo "version=$((Get-Content VERSION -Raw).Trim())" >> $env:GITHUB_OUTPUT
      - name: Compilar instalador
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "No se encuentra Inno Setup: $compiler" }
          if (!(Test-Path "dist\pcp_sqlite_api.exe")) { throw "No se ha generado pcp_sqlite_api.exe" }
          & $compiler "installer\PrintCostProfit.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC ha terminado con codigo $LASTEXITCODE" }
      - name: Firmar instalador de Windows (si hay certificado configurado)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $installer = Get-ChildItem "dist-installer\\PrintCostProfit-Setup-*.exe" | Select-Object -First 1
          if (!$installer) { throw "No se encuentra el instalador para firmar." }

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Warning "No se ha configurado el certificado. El instalador se publicará SIN firma digital."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "windows-signing-certificate.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\\Windows Kits\\10\\bin\\*\\x64\\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signtool) { throw "No se encuentra signtool.exe en el runner." }

          & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "La firma digital ha fallado (signtool: $LASTEXITCODE)." }

          & $signtool.FullName verify /pa /v $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "La verificación de la firma digital ha fallado." }

          Remove-Item $pfxPath -Force
          "signed=true" >> $env:GITHUB_OUTPUT
      - name: Empaquetar instalador en ZIP para descarga
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist-installer\PrintCostProfit-Setup-*.exe" | Select-Object -First 1
          if (!$installer) { throw "No se encuentra el instalador para empaquetar." }
          $version = (Get-Content VERSION -Raw).Trim()
          $zipPath = "dist-installer\PrintCostProfit-Windows-Installer-v$version.zip"
          Compress-Archive -Path $installer.FullName -DestinationPath $zipPath -Force
          if (!(Test-Path $zipPath)) { throw "No se ha creado el ZIP del instalador." }
      - name: Publicar artefacto de compilacion manual
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PrintCostProfit-Windows-Installer-v${{ steps.app_version.outputs.version }}
          path: dist-installer/PrintCostProfit-Windows-Installer-v*.zip
          if-no-files-found: error
      - name: Crear Release y adjuntar instalador en ejecucion manual o etiqueta
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          target_commitish: main
          name: Print Cost & Profit v1.1 (instalador actualizado)
          generate_release_notes: false
          body: Instalador de Windows actualizado para Print Cost & Profit v1.1. Sustituye el instalador anterior; la versión pública de la aplicación sigue siendo v1.1.
          overwrite_files: true
          files: dist-installer/PrintCostProfit-Windows-Installer-v*.zip
