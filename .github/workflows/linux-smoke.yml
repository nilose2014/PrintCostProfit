name: Linux smoke tests

on:
  push:
    branches: [linux]
  pull_request:
    branches: [linux]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile pcp_sqlite_store.py linux/pcp_linux_server.py
      - name: Check JavaScript syntax
        run: for file in js/*.js; do node --check "$file"; done
      - name: Run Linux API and SQLite smoke tests
        run: python -m unittest discover -s linux/tests -v
