name: Publicar releases Windows y Linux v1.4

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar artefactos validados de Actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/windows release/linux
          gh run download 41820056926 --repo "${GITHUB_REPOSITORY}" --name "PrintCostProfit-Windows-Installer-v1.4" --dir release/windows
          gh run download 41823149214 --repo "${GITHUB_REPOSITORY}" --name "PrintCostProfit-Linux-DEB" --dir release/linux
          DEB_ZIP="$(find release/linux -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [ -z "$DEB_ZIP" ]; then
            echo "No se encontró el paquete .deb en el artefacto descargado"
            find release/linux -maxdepth 2 -type f -print
            exit 1
          fi
          mv "$DEB_ZIP" release/PrintCostProfit-Linux-v1.4-amd64.deb
          find release/windows -maxdepth 2 -type f -print
          ls -lh release/PrintCostProfit-Linux-v1.4-amd64.deb

      - name: Crear publicación Windows v1.4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.4 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && {
            echo "La release v1.4 ya existe; no se modifica automáticamente."
            exit 1
          } || true
          WIN_ZIP="$(find release/windows -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$WIN_ZIP"
          gh release create v1.4 "$WIN_ZIP" --repo "${GITHUB_REPOSITORY}" --target main --title "Print Cost & Profit Windows v1.4" --notes "## Windows v1.4

Instalador oficial de Windows para Print Cost & Profit v1.4.

- Paquete generado y validado mediante GitHub Actions.
- Compatible con Windows; conserva la publicación Linux independiente.

Descarga el ZIP, descomprímelo y ejecuta el instalador incluido."

      - name: Crear publicación Linux v1.4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view linux-v1.4 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && {
            echo "La release linux-v1.4 ya existe; no se modifica automáticamente."
            exit 1
          } || true
          gh release create linux-v1.4 release/PrintCostProfit-Linux-v1.4-amd64.deb --repo "${GITHUB_REPOSITORY}" --target linux --title "Print Cost & Profit Linux v1.4" --notes "## Linux v1.4

Instalador oficial DEB para Print Cost & Profit Linux v1.4.

- Paquete para Ubuntu y Debian de 64 bits (amd64).
- Revisión técnica Debian: 1.4-1.
- Conserva los datos de usuario durante la desinstalación.

Instalación: `sudo apt install ./PrintCostProfit-Linux-v1.4-amd64.deb`"
